<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake - Claudes Games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      justify-content: safe center;
      gap: 12px;
      padding: 16px;
      min-height: 100vh;
      min-height: 100dvh;
      /* The whole page is the swipe area: no scrolling, zooming or pull-to-refresh */
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(var(--glow1), 0.35), transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(var(--glow2), 0.4), transparent 60%),
        linear-gradient(160deg, #02040a 0%, var(--mid) 50%, #000000 100%);
    }

    .back {
      position: fixed;
      top: 24px;
      left: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
    }

    .back:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    h1 {
      font-weight: 900;
      letter-spacing: 0.15em;
      font-size: clamp(1.8rem, 5vw, 3rem);
      text-shadow: 0 0 20px rgba(var(--accent), 0.5);
    }

    .score {
      font-size: 1.1rem;
      color: #dfe8ff;
    }

    canvas {
      width: min(90vw, 70vh, 480px);
      width: min(92vw, calc(100dvh - 300px), 480px);
      min-width: 200px;
      height: auto;
      aspect-ratio: 1;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(var(--glow1), 0.35);
    }

    .hint {
      color: #9fb2dd;
      font-size: 0.95rem;
      text-align: center;
    }

    /* On-screen arrow pad, shown on touch screens */
    .dpad {
      display: none;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 48px);
      gap: 6px;
    }

    .dpad button {
      font-size: 1.4rem;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      touch-action: none;
    }

    .dpad button:active {
      background: rgba(var(--accent), 0.35);
    }

    .dpad .up    { grid-area: 1 / 2; }
    .dpad .left  { grid-area: 2 / 1; }
    .dpad .right { grid-area: 2 / 3; }
    .dpad .down  { grid-area: 3 / 2; }

    @media (hover: none), (pointer: coarse), (max-width: 600px) {
      .dpad { display: grid; }
      h1 { font-size: 1.8rem; line-height: 42px; }
      .hint { font-size: 0.85rem; }
      .back { top: 16px; }
    }

    /* Narrow phones: arrow-only Home button so it can't bump into the title */
    @media (max-width: 420px) {
      .back { padding: 10px 14px; }
      .back-text { display: none; }
    }

    /* Phone held sideways: board on the left, title/score/arrows on the right */
    @media (orientation: landscape) and (max-height: 500px) {
      body {
        display: grid;
        grid-template-columns: auto auto;
        grid-template-areas: "board info" "board dpad";
        justify-content: center;
        align-content: center;
        column-gap: 32px;
        row-gap: 12px;
        padding-left: 140px;
      }
      canvas { grid-area: board; width: calc(100dvh - 32px); min-width: 0; }
      .info { grid-area: info; align-self: end; }
      .dpad { grid-area: dpad; align-self: start; justify-self: center; }
      .hint { display: none; }
    }
  </style>
  <script src="theme.js"></script>
</head>
<body>
  <a class="back" href="index.html" aria-label="Home">&larr;<span class="back-text"> Home</span></a>

  <div class="info">
    <h1>SNAKE</h1>
    <div class="score">Score: <span id="score">0</span> &nbsp;|&nbsp; Best: <span id="best">0</span></div>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="dpad">
    <button type="button" class="up" data-dir="0,-1" aria-label="Up">&uarr;</button>
    <button type="button" class="left" data-dir="-1,0" aria-label="Left">&larr;</button>
    <button type="button" class="right" data-dir="1,0" aria-label="Right">&rarr;</button>
    <button type="button" class="down" data-dir="0,1" aria-label="Down">&darr;</button>
  </div>
  <p class="hint" id="hint"></p>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const hintEl = document.getElementById('hint');

    const isTouch = matchMedia('(hover: none), (pointer: coarse)').matches;
    const HINTS = isTouch
      ? { start: 'Swipe anywhere or use the arrows to start', playing: 'Swipe or use the arrows to steer', over: 'Game over! Swipe, tap or use the arrows to play again' }
      : { start: 'Press an arrow key or WASD to start', playing: 'Arrow keys / WASD to steer', over: 'Game over! Press any arrow key or WASD to play again' };
    hintEl.textContent = HINTS.start;

    const CELLS = 20;
    const SIZE = canvas.width / CELLS;
    const SPEED_MS = 110;

    const appleImg = new Image();
    appleImg.src = 'apple.png';
    appleImg.onload = () => draw();

    let best = 0;
    try { best = Number(localStorage.getItem('snakeBest')) || 0; } catch (e) {}
    bestEl.textContent = best;

    let snake, dir, nextDir, food, score, running, gameOver, timer;

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = dir;
      score = 0;
      scoreEl.textContent = score;
      running = false;
      gameOver = false;
      placeFood();
      draw();
    }

    function placeFood() {
      do {
        food = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
      const ate = head.x === food.x && head.y === food.y;
      // The tail moves out of the way unless we're growing this step
      const body = ate ? snake : snake.slice(0, -1);
      const hitSelf = body.some(s => s.x === head.x && s.y === head.y);

      if (hitWall || hitSelf) {
        endGame();
        return;
      }

      snake.unshift(head);
      if (ate) {
        score++;
        scoreEl.textContent = score;
        if (snake.length === CELLS * CELLS) {
          endGame();
          return;
        }
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function endGame() {
      clearInterval(timer);
      running = false;
      gameOver = true;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem('snakeBest', best); } catch (e) {}
      }
      draw();
      hintEl.textContent = HINTS.over;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      for (let i = 1; i < CELLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * SIZE, 0); ctx.lineTo(i * SIZE, canvas.height);
        ctx.moveTo(0, i * SIZE); ctx.lineTo(canvas.width, i * SIZE);
        ctx.stroke();
      }

      // Food (apple)
      if (appleImg.complete && appleImg.naturalWidth) {
        ctx.drawImage(appleImg, food.x * SIZE, food.y * SIZE, SIZE, SIZE);
      }

      // Snake
      snake.forEach((s, i) => {
        const hue = Ambience.hue();
        ctx.fillStyle = i === 0 ? `hsl(${hue}, 100%, 78%)` : `hsl(${hue}, 90%, ${68 - (i / snake.length) * 25}%)`;
        ctx.beginPath();
        ctx.roundRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2, 5);
        ctx.fill();
      });

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '900 36px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
        ctx.font = '18px system-ui, sans-serif';
        ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 32);
      }
    }

    function turn(x, y) {
      if (gameOver) reset();
      // Can't reverse straight into yourself
      if (x === -dir.x && y === -dir.y) {
        if (running) return;
        x = dir.x; y = dir.y; // first key was "backwards": just start moving forward
      }
      nextDir = { x, y };
      if (!running) {
        running = true;
        hintEl.textContent = HINTS.playing;
        timer = setInterval(step, SPEED_MS);
      }
    }

    const KEYS = {
      ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
      ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
      ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
      ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
    };

    document.addEventListener('keydown', (e) => {
      const k = KEYS[e.key];
      if (!k) return;
      e.preventDefault();
      turn(k[0], k[1]);
    });

    // On-screen arrows: react on press, not release, so turns feel instant
    document.querySelectorAll('.dpad button').forEach(b => {
      const [x, y] = b.dataset.dir.split(',').map(Number);
      b.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        turn(x, y);
      });
    });

    // Touch: swipe anywhere to steer, tap to restart
    let touchStart = null;
    document.addEventListener('touchstart', (e) => {
      if (e.target.closest('.dpad, a')) return;
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });
    document.addEventListener('touchend', (e) => {
      if (!touchStart) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      touchStart = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) {
        if (gameOver) { reset(); turn(1, 0); }
        return;
      }
      if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0);
      else turn(0, Math.sign(dy));
    });

    reset();
  </script>
</body>
</html>
