<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake - Claudes Games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(30, 80, 180, 0.35), transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(10, 40, 120, 0.4), transparent 60%),
        linear-gradient(160deg, #02040a 0%, #071330 50%, #000000 100%);
    }

    .back {
      position: fixed;
      top: 24px;
      left: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
    }

    .back:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    h1 {
      font-weight: 900;
      letter-spacing: 0.15em;
      font-size: clamp(1.8rem, 5vw, 3rem);
      text-shadow: 0 0 20px rgba(80, 140, 255, 0.5);
    }

    .score {
      font-size: 1.1rem;
      color: #dfe8ff;
    }

    canvas {
      width: min(90vw, 70vh, 480px);
      height: auto;
      aspect-ratio: 1;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(30, 80, 180, 0.35);
    }

    .hint {
      color: #9fb2dd;
      font-size: 0.95rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">&larr; Home</a>

  <h1>SNAKE</h1>
  <div class="score">Score: <span id="score">0</span> &nbsp;|&nbsp; Best: <span id="best">0</span></div>
  <canvas id="game" width="400" height="400"></canvas>
  <p class="hint" id="hint">Press an arrow key, WASD, or swipe to start</p>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const hintEl = document.getElementById('hint');

    const CELLS = 20;
    const SIZE = canvas.width / CELLS;
    const SPEED_MS = 110;

    const appleImg = new Image();
    appleImg.src = 'apple.png';
    appleImg.onload = () => draw();

    let best = 0;
    try { best = Number(localStorage.getItem('snakeBest')) || 0; } catch (e) {}
    bestEl.textContent = best;

    let snake, dir, nextDir, food, score, running, gameOver, timer;

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = dir;
      score = 0;
      scoreEl.textContent = score;
      running = false;
      gameOver = false;
      placeFood();
      draw();
    }

    function placeFood() {
      do {
        food = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
      const ate = head.x === food.x && head.y === food.y;
      // The tail moves out of the way unless we're growing this step
      const body = ate ? snake : snake.slice(0, -1);
      const hitSelf = body.some(s => s.x === head.x && s.y === head.y);

      if (hitWall || hitSelf) {
        endGame();
        return;
      }

      snake.unshift(head);
      if (ate) {
        score++;
        scoreEl.textContent = score;
        if (snake.length === CELLS * CELLS) {
          endGame();
          return;
        }
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function endGame() {
      clearInterval(timer);
      running = false;
      gameOver = true;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem('snakeBest', best); } catch (e) {}
      }
      draw();
      hintEl.textContent = 'Game over! Press any arrow key, WASD, or tap to play again';
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      for (let i = 1; i < CELLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * SIZE, 0); ctx.lineTo(i * SIZE, canvas.height);
        ctx.moveTo(0, i * SIZE); ctx.lineTo(canvas.width, i * SIZE);
        ctx.stroke();
      }

      // Food (apple)
      if (appleImg.complete && appleImg.naturalWidth) {
        ctx.drawImage(appleImg, food.x * SIZE, food.y * SIZE, SIZE, SIZE);
      }

      // Snake
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#8fb8ff' : `hsl(220, 90%, ${68 - (i / snake.length) * 25}%)`;
        ctx.beginPath();
        ctx.roundRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2, 5);
        ctx.fill();
      });

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '900 36px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
        ctx.font = '18px system-ui, sans-serif';
        ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 32);
      }
    }

    function turn(x, y) {
      if (gameOver) reset();
      // Can't reverse straight into yourself
      if (x === -dir.x && y === -dir.y) {
        if (running) return;
        x = dir.x; y = dir.y; // first key was "backwards": just start moving forward
      }
      nextDir = { x, y };
      if (!running) {
        running = true;
        hintEl.textContent = 'Arrow keys / WASD / swipe to steer';
        timer = setInterval(step, SPEED_MS);
      }
    }

    const KEYS = {
      ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
      ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
      ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
      ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
    };

    document.addEventListener('keydown', (e) => {
      const k = KEYS[e.key];
      if (!k) return;
      e.preventDefault();
      turn(k[0], k[1]);
    });

    // Touch: swipe to steer, tap to restart
    let touchStart = null;
    canvas.addEventListener('touchstart', (e) => {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('touchend', (e) => {
      if (!touchStart) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      touchStart = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) {
        if (gameOver) { reset(); turn(1, 0); }
        return;
      }
      if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0);
      else turn(0, Math.sign(dy));
    });

    reset();
  </script>
</body>
</html>
