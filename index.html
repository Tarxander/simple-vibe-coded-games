<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claudes Games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      overflow: hidden;
      /* Ambient blue / black mix */
      background:
        radial-gradient(ellipse at 20% 30%, rgba(var(--glow1), 0.35), transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(var(--glow2), 0.4), transparent 60%),
        radial-gradient(ellipse at 50% 50%, rgba(var(--glow3), 0.25), transparent 70%),
        linear-gradient(160deg, #02040a 0%, var(--mid) 50%, #000000 100%);
      background-size: 200% 200%;
      animation: ambient 20s ease-in-out infinite alternate;
    }

    @keyframes ambient {
      0%   { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    /* Title */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 24px 16px;
      pointer-events: none;
    }

    header h1 {
      font-weight: 900;
      font-size: clamp(2rem, 6vw, 4rem);
      letter-spacing: 0.15em;
      color: #fff;
      text-shadow: 0 0 20px rgba(var(--accent), 0.5);
    }

    /* Dropdown menu (left side, drops from the top) */
    .menu {
      position: fixed;
      top: 24px;
      left: 16px;
      z-index: 10;
    }

    .menu-button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.2s;
    }

    .menu-button:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .menu-list {
      list-style: none;
      margin-top: 8px;
      min-width: 200px;
      background: rgba(var(--panel), 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transform-origin: top;
      transform: scaleY(0);
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .menu.open .menu-list {
      transform: scaleY(1);
      opacity: 1;
    }

    .menu-list a {
      display: block;
      padding: 12px 18px;
      color: #dfe8ff;
      text-decoration: none;
      transition: background 0.15s;
    }

    .menu-list a:hover {
      background: rgba(var(--accent), 0.2);
    }

    /* Centered logo */
    main {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      width: min(40vw, 260px);
      height: auto;
      filter: drop-shadow(0 0 30px rgba(217, 119, 87, 0.45));
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    @media (max-width: 600px) {
      header { padding-top: 80px; }
    }
  </style>
  <script src="theme.js"></script>
</head>
<body>
  <header>
    <h1>CLAUDES GAMES</h1>
  </header>

  <nav class="menu" id="menu">
    <button class="menu-button" id="menu-button" aria-expanded="false" aria-controls="menu-list">
      &#9776; Menu
    </button>
    <ul class="menu-list" id="menu-list">
      <li><a href="#">Home</a></li>
      <li><a href="snake.html">Snake</a></li>
      <li><a href="#">Game 2</a></li>
      <li><a href="#">Game 3</a></li>
      <li><a href="settings.html">Settings</a></li>
    </ul>
  </nav>

  <main>
    <!-- Claude logo (starburst mark) -->
    <svg class="logo" id="logo" viewBox="-100 -100 200 200" role="img" aria-label="Claude logo"></svg>
  </main>

  <script>
    // Draw the Claude starburst: tapered rays radiating from the center
    const logo = document.getElementById('logo');
    const rays = 12;
    const lengths = [92, 78, 88, 72, 95, 80, 86, 74, 90, 76, 84, 70];
    let d = '';
    for (let i = 0; i < rays; i++) {
      const angle = (i / rays) * Math.PI * 2;
      const len = lengths[i];
      const w = 0.16; // half-width of the ray base, in radians
      const tip = [Math.cos(angle) * len, Math.sin(angle) * len];
      const l = [Math.cos(angle - w) * 14, Math.sin(angle - w) * 14];
      const r = [Math.cos(angle + w) * 14, Math.sin(angle + w) * 14];
      const tl = [tip[0] + Math.cos(angle - Math.PI / 2) * 5, tip[1] + Math.sin(angle - Math.PI / 2) * 5];
      const tr = [tip[0] + Math.cos(angle + Math.PI / 2) * 5, tip[1] + Math.sin(angle + Math.PI / 2) * 5];
      d += `M0 0 L${l} L${tl} Q${tip[0] + Math.cos(angle) * 5},${tip[1] + Math.sin(angle) * 5} ${tr} L${r} Z `;
    }
    logo.innerHTML = `<path d="${d}" fill="#D97757"/><circle r="18" fill="#D97757"/>`;

    // Dropdown toggle
    const menu = document.getElementById('menu');
    const button = document.getElementById('menu-button');
    button.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = menu.classList.toggle('open');
      button.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', () => {
      menu.classList.remove('open');
      button.setAttribute('aria-expanded', 'false');
    });
  </script>
</body>
</html>
